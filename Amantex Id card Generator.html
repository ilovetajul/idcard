<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রো আইডি কার্ড মেকার - আমানটেক্স</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* বেসিক স্টাইল ও রিসেট */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Hind Siliguri', 'Arial', sans-serif;
            background-color: #f0f4f8; /* সফট ব্যাকগ্রাউন্ড কালার */
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
            padding-bottom: 50px;
        }

        /* সুন্দর হেডার */
        .app-header {
            width: 100%;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            text-align: center;
            padding: 20px 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .app-header h1 { font-size: 24px; font-weight: 700; margin-bottom: 5px; }
        .app-header p { font-size: 14px; opacity: 0.9; }

        /* কন্ট্রোল প্যানেল (ফর্ম) */
        .editor-panel {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            width: 95%;
            max-width: 900px;
            margin-bottom: 40px;
        }
        
        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: #1e3c72;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e2e8f0;
            display: block;
            margin-top: 10px;
        }

        /* মোবাইলের জন্য স্মার্ট গ্রিড */
        .grid-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .full-width { grid-column: 1 / -1; } /* সব স্ক্রিনেই পুরো জায়গা নেবে */

        /* ইনপুট ফিল্ডের ডিজাইন */
        .input-group { display: flex; flex-direction: column; }
        .input-group label { font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #4a5568; }
        .input-group input {
            padding: 10px 12px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.3s ease;
            background: #f8fafc;
        }
        .input-group input:focus {
            border-color: #3182ce;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
            outline: none;
        }
        .input-group input[type="file"] { padding: 7px 10px; background: #fff; cursor: pointer; }

        /* বাটন ডিজাইন */
        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
            border-top: 1px solid #e2e8f0;
            padding-top: 25px;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
            color: white;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-add {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }
        .btn-add:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4); }
        .btn-add:active { transform: translateY(0); }

        .btn-print {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }
        .btn-print:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4); }
        .btn-print:active { transform: translateY(0); }

        /* লুকানো প্রিভিউ */
        #hidden-logo-preview, #hidden-photo-preview { display: none; }

        /* কার্ডের কন্টেইনার */
        .cards-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            width: 95%;
            max-width: 21cm;
            justify-content: center; /* মোবাইলে সেন্টারে রাখার জন্য */
            background: white;
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .card-wrapper {
            position: relative;
            page-break-inside: avoid;
            transition: transform 0.3s;
        }
        .card-wrapper:hover { transform: scale(1.02); }

        .delete-btn {
            position: absolute;
            top: -12px;
            right: -12px;
            background: #ef4444;
            color: white;
            border: 2px solid white;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            font-weight: bold;
            z-index: 10;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            transition: 0.2s;
        }
        .delete-btn:hover { background: #dc2626; transform: scale(1.1); }

        /* আইডি কার্ডের মেইন ডিজাইন (আগের মতই, তবে ফন্ট ফ্যামিলি এরিয়াল রাখা হয়েছে প্রিন্টের জন্য) */
        .id-card {
            font-family: 'Arial', sans-serif;
            width: 5.4cm;
            height: 8.6cm;
            border: 1px solid #999;
            border-radius: 8px;
            background-color: white;
            padding: 12px 12px 8px 12px;
            box-sizing: border-box;
            font-size: 8px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .id-card:hover { box-shadow: none; } /* হোভারে শ্যাডো মুছে দেওয়া হলো প্রিন্টে ঝামেলার এড়াতে */

        .header { display: flex; align-items: center; border-bottom: 1px solid #ddd; padding-bottom: 4px; margin-bottom: 6px; }
        .logo-preview { width: 32px; height: auto; margin-right: 8px; }
        .company-name { font-size: 11px; font-weight: bold; color: #d11e22; }
        
        .content-wrapper { display: flex; flex-direction: column; align-items: center; flex-grow: 1; }
        .photo-preview { width: 1.9cm; height: 1.8cm; border: 1px solid #000; margin-bottom: 6px; object-fit: cover; background: #eee; }
        
        .info-table { width: 100%; border-collapse: collapse; }
        .info-table td { padding: 1.5px 0; vertical-align: top; line-height: 1.2; }
        .label { width: 38%; font-weight: bold; }
        .value { width: 62%; font-weight: bold; color: #000; }
        
        .footer { display: flex; justify-content: space-between; margin-top: 5px; padding-top: 2px; font-size: 7.5px; font-weight: bold; }
        .signature-box { text-align: center; width: 45%; display: flex; flex-direction: column; align-items: center; }
        .sig-text { font-family: 'Brush Script MT', 'cursive', sans-serif; font-size: 14px; font-style: italic; color: #000; margin-bottom: 2px; line-height: 1; min-height: 14px; }
        .signature-line { border-top: 1px dotted black; width: 100%; margin-bottom: 2px; }

        /* প্রিন্ট করার সময়ের স্টাইল */
        @media print {
            @page { size: A4; margin: 10mm; }
            body { background: white; padding: 0; }
            .app-header, .editor-panel, .delete-btn { display: none !important; }
            .cards-container { box-shadow: none; padding: 0; max-width: 100%; gap: 12px; width: auto; justify-content: flex-start; }
            .card-wrapper { transform: none !important; }
            .id-card { border: 1px solid #000; box-shadow: none; }
        }
    </style>
</head>
<body>

    <!-- হেডার -->
    <header class="app-header">
        <h1>প্রো আইডি কার্ড মেকার</h1>
        <p>A4 পেজে একসাথে একাধিক আইডি কার্ড তৈরি ও প্রিন্ট করুন</p>
    </header>

    <!-- লুকানো ইমেজ ট্যাগ -->
    <img id="hidden-logo-preview" src="https://www.amantexbd.com/wp-content/uploads/2018/11/Amantex-Ltd.png">
    <img id="hidden-photo-preview" src="https://via.placeholder.com/150">

    <!-- এডিটর ফরম -->
    <div class="editor-panel">
        
        <div class="section-title">🏢 কোম্পানির তথ্য (সবার জন্য এক)</div>
        <div class="grid-form">
            <div class="input-group">
                <label>কোম্পানির লোগো (Upload)</label>
                <input type="file" accept="image/*" onchange="loadFile(event, 'hidden-logo-preview')">
            </div>
            <div class="input-group">
                <label>কোম্পানির নাম</label>
                <input type="text" id="g-comp" value="আমানটেক্স লিমিটেড">
            </div>
            <div class="input-group">
                <label>ইস্যুর তারিখ</label>
                <input type="text" id="g-issue" value="০২/০২/২০২৫">
            </div>
            <div class="input-group">
                <label>কর্তৃপক্ষের স্বাক্ষর (টেক্সট)</label>
                <input type="text" id="g-auth-sig" value="Tanvir">
            </div>
        </div>

        <div class="section-title">👤 কর্মচারীর তথ্য (প্রতিটি কার্ডের জন্য বদলান)</div>
        <div class="grid-form">
            <div class="input-group">
                <label>কর্মচারীর ছবি (Upload)</label>
                <input type="file" accept="image/*" onchange="loadFile(event, 'hidden-photo-preview')">
            </div>
            <div class="input-group">
                <label>কর্মচারীর স্বাক্ষর (টেক্সট)</label>
                <input type="text" id="e-sig" value="Tajul">
            </div>
            <div class="input-group">
                <label>নাম</label>
                <input type="text" id="e-name" value="মোঃ তাজুল ইসলাম">
            </div>
            <div class="input-group">
                <label>আইডি নং</label>
                <input type="text" id="e-id" value="004889">
            </div>
            <div class="input-group">
                <label>পদবী</label>
                <input type="text" id="e-desig" value="জুনিয়র কোয়ালিটি ইন্সপেক্টর">
            </div>
            <div class="input-group">
                <label>সেকশন</label>
                <input type="text" id="e-sec" value="কোয়ালিটি (ইএমবি)-জেনারেল">
            </div>
            <div class="input-group">
                <label>ফ্লোর-লাইন</label>
                <input type="text" id="e-floor" value="০">
            </div>
            <div class="input-group">
                <label>কাজের ধরণ</label>
                <input type="text" id="e-type" value="দক্ষ">
            </div>
            <div class="input-group">
                <label>যোগদানের তারিখ</label>
                <input type="text" id="e-join" value="০২/০২/২০২৫">
            </div>
            <div class="input-group">
                <label>জাতীয় পরিচয়পত্র</label>
                <input type="text" id="e-nid" value="৭৩৫৮৭৭৮৯৫৪">
            </div>
            <div class="input-group">
                <label>রক্তের গ্রুপ</label>
                <input type="text" id="e-blood" value="এবি(+)">
            </div>
            <div class="input-group">
                <label>জরুরী মোবা#</label>
                <input type="text" id="e-mobile" value="০১৭৪৯৭১৩০০৪">
            </div>
            <!-- ঠিকানার ঘর সব স্ক্রিনেই ফুল উইডথ নেবে -->
            <div class="input-group full-width">
                <label>স্থায়ী ঠিকানা</label>
                <input type="text" id="e-address" value="বগুড়া সদর, বগুড়া, রাজশাহী">
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn btn-add" onclick="addCard()">
                <span>➕</span> কার্ড যোগ করুন
            </button>
            <button class="btn btn-print" onclick="window.print()">
                <span>🖨️</span> A4 পেজে প্রিন্ট
            </button>
        </div>
    </div>

    <!-- কার্ড প্রিভিউ সেকশন -->
    <div class="cards-container" id="cards-container">
        <!-- JS দিয়ে কার্ড তৈরি হবে -->
    </div>

    <script>
        // ছবি আপলোড হলে প্রিভিউতে সেট করে রাখা
        var loadFile = function(event, targetId) {
            var output = document.getElementById(targetId);
            output.src = URL.createObjectURL(event.target.files[0]);
        };

        // নতুন কার্ড যোগ করার ফাংশন
        function addCard() {
            // ডাটা সংগ্রহ করা
            const logo = document.getElementById('hidden-logo-preview').src;
            const photo = document.getElementById('hidden-photo-preview').src;
            const comp = document.getElementById('g-comp').value;
            const issue = document.getElementById('g-issue').value;
            const authSig = document.getElementById('g-auth-sig').value;

            const name = document.getElementById('e-name').value;
            const idNo = document.getElementById('e-id').value;
            const desig = document.getElementById('e-desig').value;
            const sec = document.getElementById('e-sec').value;
            const floor = document.getElementById('e-floor').value;
            const type = document.getElementById('e-type').value;
            const join = document.getElementById('e-join').value;
            const nid = document.getElementById('e-nid').value;
            const blood = document.getElementById('e-blood').value;
            const mobile = document.getElementById('e-mobile').value;
            const address = document.getElementById('e-address').value;
            const empSig = document.getElementById('e-sig').value;

            // নতুন কার্ডের HTML তৈরি
            const cardHTML = `
                <div class="card-wrapper">
                    <button class="delete-btn" onclick="this.parentElement.remove()" title="কার্ড মুছুন">✖</button>
                    <div class="id-card">
                        <div class="header">
                            <img src="${logo}" class="logo-preview">
                            <div>
                                <div class="company-name">${comp}</div>
                                <div style="font-size: 7.5px;">ইস্যুর তারিখ : ${issue}</div>
                            </div>
                        </div>
                        <div class="content-wrapper">
                            <img src="${photo}" class="photo-preview">
                            <table class="info-table">
                                <tr><td class="label">নাম</td><td class="value">: ${name}</td></tr>
                                <tr><td class="label">আইডি নং</td><td class="value">: ${idNo}</td></tr>
                                <tr><td class="label">পদবী</td><td class="value">: ${desig}</td></tr>
                                <tr><td class="label">সেকশন</td><td class="value">: ${sec}</td></tr>
                                <tr><td class="label">ফ্লোর-লাইন</td><td class="value">: ${floor}</td></tr>
                                <tr><td class="label">কাজের ধরণ</td><td class="value">: ${type}</td></tr>
                                <tr><td class="label">যোগদানের তাং</td><td class="value">: ${join}</td></tr>
                                <tr><td class="label">জাতীয়পরিচয়পত্র</td><td class="value">: ${nid}</td></tr>
                                <tr><td class="label">রক্তের গ্রুপ</td><td class="value">: ${blood}</td></tr>
                                <tr><td class="label">জরুরী মোবা#</td><td class="value">: ${mobile}</td></tr>
                                <tr><td class="label">স্থায়ী ঠিকানা</td><td class="value">: ${address}</td></tr>
                            </table>
                        </div>
                        <div class="footer">
                            <div class="signature-box">
                                <div class="sig-text">${empSig}</div>
                                <div class="signature-line"></div>
                                স্বাক্ষর
                            </div>
                            <div class="signature-box">
                                <div class="sig-text">${authSig}</div>
                                <div class="signature-line"></div>
                                কর্তৃপক্ষের স্বাক্ষর
                            </div>
                        </div>
                    </div>
                </div>
            `;

            // কার্ড কন্টেইনারে যুক্ত করা
            document.getElementById('cards-container').insertAdjacentHTML('beforeend', cardHTML);
        }

        // পেজ লোড হওয়ার পর ডিফল্ট ভাবে একটি কার্ড তৈরি করে রাখা
        window.onload = function() {
            addCard();
        };
    </script>
</body>
</html>
